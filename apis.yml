name: Level Headed Games
description: >-
  Level Headed Games (Level Headed, LLC) is an independent video game studio building an original
  online cooperative multiplayer game. The studio describes itself as passionate about making
  immersive experiences that let players express themselves and have fun with their friends, and
  is building "fun, surprising, and heavily social video game worlds." Development is
  community-involved, with an open call for co-op players to join an Alpha playtest community and
  an email announcement list. As of this enrichment pass the studio publishes only a single-page
  marketing site with no announced title, no public developer surface, and no API, SDK,
  documentation, or developer portal.
